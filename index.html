<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب الحصول علي قرض مدرسي | طاقة</title>
    <meta name="description" content="منظومة تسجيل طلب الحصول علي قرض مدرسي - شركة طاقة">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="Taqa-Gas-Logo.png">
    
    <!-- Google Fonts: Cairo & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Decor Elements -->
    <div class="bg-gradient-glow top-left"></div>
    <div class="bg-gradient-glow bottom-right"></div>
    <div class="bg-grid-pattern"></div>

    <!-- Main Container -->
    <main class="main-content">
        <div class="portal-card glass-panel" id="employeePortalCard">

            <!-- Card Header: Title on Right, Logo on Left -->
            <div class="portal-header-top">
                <div class="portal-title-wrapper">
                    <h1>طلب الحصول علي قرض مدرسي</h1>
                    <p>شركة طاقة غاز</p>
                </div>
                <div class="portal-logo-wrapper">
                    <img src="Taqa-Gas-Logo.png" alt="TAQA Arabia">
                </div>
            </div>

            <!-- Registration Closed Notice -->
            <div class="section-intro text-center" style="padding: 2rem 1rem;">
                <i data-lucide="lock" style="width: 48px; height: 48px; color: var(--accent-blue); margin-bottom: 1rem;"></i>
                <h2>التسجيل مغلق مؤقتاً</h2>
                <p>عذراً، تم إيقاف استقبال طلبات القرض المدرسي مؤقتاً. سيتم الإعلان عند إعادة فتح التسجيل.</p>
            </div>
        </div>
    </main>

</body>
</html>
